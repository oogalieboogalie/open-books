# Everything on your own machine: `docker compose up`, then open http://localhost:3000
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: books
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-books}
      POSTGRES_DB: books
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U books -d books"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgres://books:${POSTGRES_PASSWORD:-books}@db:5432/books
      BUSINESS_TZ: ${BUSINESS_TZ:-America/New_York}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
