# Everything on your own machine: `docker compose up`, then open http://localhost:3000
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: books
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-books}
      POSTGRES_DB: books
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U books -d books"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgres://books:${POSTGRES_PASSWORD:-books}@db:5432/books
      BUSINESS_TZ: ${BUSINESS_TZ:-America/New_York}
      # Integrations (see README). APP_SECRET encrypts stored tokens; without it a key is kept in the appdata volume.
      APP_SECRET: ${APP_SECRET:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ENABLE_GMAIL: ${GOOGLE_ENABLE_GMAIL:-}
      INBOUND_EMAIL_DOMAIN: ${INBOUND_EMAIL_DOMAIN:-}
    volumes:
      - appdata:/app/data
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
